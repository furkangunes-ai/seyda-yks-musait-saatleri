<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYT Fizik - İnteraktif Konu Anlatımı</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #131826;
    --bg-tertiary: #1a2235;
    --bg-card: #1e2740;
    --bg-card-hover: #243152;
    --bg-pinned: #2a2240;
    --bg-known: #11151f;
    --border: #2a3552;
    --border-pinned: #ffd166;
    --border-known: #2a3552;
    --text-primary: #e8eaf0;
    --text-secondary: #a0a8bd;
    --text-muted: #6b7493;
    --accent: #6b9eff;
    --accent-hover: #4a7fdb;
    --pin: #ffd166;
    --known: #4ade80;
    --tip-bg: #2a2415;
    --tip-border: #ffd166;
    --formula-bg: #16213d;
    --formula-border: #6b9eff;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ===== HEADER ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg-secondary) 0%, rgba(19,24,38,0.95) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #6b9eff, #ffd166);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    transition: all 0.2s;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(107, 158, 255, 0.15);
  }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.6;
    pointer-events: none;
  }
  .stats {
    display: flex;
    gap: 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--bg-tertiary);
    border-radius: 6px;
  }
  .stat-icon { font-size: 14px; }
  .stat-value { color: var(--text-primary); font-weight: 600; }

  .reset-btn {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    border-color: #ff6b6b;
    color: #ff6b6b;
  }

  /* ===== LAYOUT ===== */
  .layout {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    padding: 24px;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    position: sticky;
    top: 90px;
    height: calc(100vh - 110px);
    overflow-y: auto;
    padding-right: 8px;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .unit-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .unit-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    width: 100%;
    transition: all 0.2s;
  }
  .unit-btn:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }
  .unit-btn.active {
    background: var(--bg-card);
    border-color: var(--accent);
    color: var(--text-primary);
  }
  .unit-icon { font-size: 18px; }
  .unit-num {
    background: var(--bg-tertiary);
    width: 24px;
    height: 24px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-left: auto;
  }
  .unit-btn.active .unit-num {
    background: var(--accent);
    color: white;
  }

  /* ===== MAIN CONTENT ===== */
  .main {
    min-width: 0;
  }
  .unit-header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .unit-title {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .unit-subtitle {
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* ===== SECTION ===== */
  .section {
    margin-bottom: 32px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .section-header:hover { background: var(--bg-tertiary); }
  .section-header.pinned { background: rgba(255, 209, 102, 0.08); }
  .section-header.known { background: rgba(74, 222, 128, 0.06); }
  .section-icon { font-size: 18px; }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .section-count {
    background: var(--bg-tertiary);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .section-toggle {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 14px;
    transition: transform 0.2s;
  }
  .section.collapsed .section-toggle { transform: rotate(-90deg); }
  .section.collapsed .section-content { display: none; }

  /* ===== TOPIC ===== */
  .topic {
    margin-bottom: 24px;
  }
  .topic-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
  }
  .topic-tip {
    background: var(--tip-bg);
    border-left: 3px solid var(--tip-border);
    padding: 10px 14px;
    border-radius: 6px;
    color: #ffd97d;
    font-size: 13px;
    margin-bottom: 12px;
  }

  /* ===== CARD ===== */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    position: relative;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    background: var(--bg-card-hover);
    border-color: #3a4a78;
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .card.pinned {
    background: var(--bg-pinned);
    border-color: var(--border-pinned);
    box-shadow: 0 0 0 1px var(--border-pinned), var(--shadow);
  }
  .card.known {
    background: var(--bg-known);
    border-color: var(--border-known);
    opacity: 0.55;
  }
  .card.known:hover {
    opacity: 0.85;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }
  .card-type {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .card-type.definition { background: rgba(107, 158, 255, 0.15); color: #6b9eff; }
  .card-type.list { background: rgba(167, 139, 250, 0.15); color: #a78bfa; }
  .card-type.tip { background: rgba(255, 209, 102, 0.15); color: #ffd166; }
  .card-type.formula { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
  .card-type.example { background: rgba(244, 114, 182, 0.15); color: #f472b6; }

  .card-actions {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .action-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    padding: 0;
  }
  .action-btn:hover {
    transform: scale(1.08);
  }
  .action-btn.pin:hover {
    background: rgba(255, 209, 102, 0.15);
    border-color: var(--pin);
    color: var(--pin);
  }
  .action-btn.pin.active {
    background: var(--pin);
    border-color: var(--pin);
    color: #1a1a2e;
  }
  .action-btn.know:hover {
    background: rgba(74, 222, 128, 0.15);
    border-color: var(--known);
    color: var(--known);
  }
  .action-btn.know.active {
    background: var(--known);
    border-color: var(--known);
    color: #0a0e1a;
  }

  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
  }
  .card-content {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .card-details {
    list-style: none;
    margin-bottom: 10px;
  }
  .card-details li {
    font-size: 13px;
    color: var(--text-secondary);
    padding: 4px 0 4px 18px;
    position: relative;
  }
  .card-details li::before {
    content: "▸";
    position: absolute;
    left: 4px;
    color: var(--accent);
    font-size: 11px;
    top: 7px;
  }
  .card-formula {
    background: var(--formula-bg);
    border-left: 3px solid var(--formula-border);
    padding: 8px 12px;
    border-radius: 4px;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 14px;
    color: #4ade80;
    margin: 8px 0;
    overflow-x: auto;
  }
  .card-tip {
    background: var(--tip-bg);
    border-left: 3px solid var(--tip-border);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12.5px;
    color: #ffd97d;
    margin-top: 10px;
  }
  .card-tip::before {
    content: "💡 ";
  }
  .card-id {
    font-size: 10px;
    color: var(--text-muted);
    font-family: monospace;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    opacity: 0.5;
  }

  /* ===== EMPTY ===== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
    background: var(--bg-secondary);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .empty-state-icon { font-size: 32px; display: block; margin-bottom: 10px; }

  /* ===== MOBILE ===== */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      padding: 16px;
    }
    .sidebar {
      position: static;
      height: auto;
      padding-right: 0;
    }
    .unit-nav {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .unit-btn {
      flex-shrink: 0;
      white-space: nowrap;
    }
    .unit-num { display: none; }
    .cards-grid { grid-template-columns: 1fr; }
    .header-inner { gap: 8px; }
    .stats { width: 100%; order: 3; }
  }

  /* ===== HIGHLIGHT ===== */
  mark {
    background: rgba(255, 209, 102, 0.3);
    color: var(--text-primary);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* Keyboard shortcuts hint */
  .shortcut-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
    padding: 2px 6px;
    background: var(--bg-tertiary);
    border-radius: 4px;
    font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚛️ TYT Fizik</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Konu, kavram veya formül ara...">
    </div>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-icon">📌</span>

      </div>

        <span class="stat-icon">✅</span>

    <button class="reset-btn" onclick="resetProgress()" title="Tüm işaretlemeleri sıfırla">↻ Sıfırla</button>

</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="unit-nav" id="unitNav"></nav>
  </aside>

  <main class="main" id="mainContent"></main>
</div>

// ============== STATE & STORAGE ==============
const STORAGE_KEY = 'tyt_fizik_state_v1';

function loadState() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      const parsed = JSON.parse(data);
      return {
        pinned: new Set(parsed.pinned || []),
        known: new Set(parsed.known || []),
        currentUnit: parsed.currentUnit || 1
      };
    }
  } catch (e) { console.warn('State load failed', e); }
  return { pinned: new Set(), known: new Set(), currentUnit: 1 };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      pinned: [...state.pinned],
      known: [...state.known],
      currentUnit: state.currentUnit
    }));
  } catch (e) { console.warn('State save failed', e); }
}

const state = loadState();
let searchQuery = '';

// ============== HELPERS ==============
function escapeHTML(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function highlightSearch(text) {
  if (!searchQuery) return escapeHTML(text);
  const escaped = escapeHTML(text);
  const re = new RegExp('(' + searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function getAllCardsInUnit(unit) {
  const cards = [];
  unit.topics.forEach(topic => {
    topic.cards.forEach(card => {
      cards.push({ ...card, _topic: topic });
    });
  });
  return cards;
}

function cardMatchesSearch(card) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const text = [
    card.title || '',
    card.content || '',
    card.formula || '',
    card.tip || '',
    ...(card.details || [])
  ].join(' ').toLowerCase();
  return text.includes(q);
}

// ============== RENDER ==============
function renderSidebar() {
  const nav = document.getElementById('unitNav');
  nav.innerHTML = FIZIK_DATA.units.map(unit => {
    const isActive = unit.id === state.currentUnit;
    const totalCards = getAllCardsInUnit(unit).length;
    return `
      <button class="unit-btn ${isActive ? 'active' : ''}" data-unit="${unit.id}">
        <span class="unit-icon">${unit.icon}</span>
        <span style="flex:1">${unit.title}</span>
        <span class="unit-num">${unit.id}</span>
      </button>
    `;
  }).join('');

  nav.querySelectorAll('.unit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentUnit = parseInt(btn.dataset.unit);
      saveState();
      renderSidebar();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function renderCard(card, topic) {
  const isPinned = state.pinned.has(card.id);
  const isKnown = state.known.has(card.id);
  const cardClass = isPinned ? 'pinned' : (isKnown ? 'known' : '');

  const detailsHTML = (card.details && card.details.length)
    ? `<ul class="card-details">${card.details.map(d => `<li>${highlightSearch(d)}</li>`).join('')}</ul>`
    : '';

  const formulaHTML = card.formula
    ? `<div class="card-formula">${escapeHTML(card.formula)}</div>`
    : '';

  const tipHTML = card.tip
    ? `<div class="card-tip">${highlightSearch(card.tip)}</div>`
    : '';

  const typeLabels = {
    definition: 'TANIM',
    list: 'LİSTE',
    tip: 'İPUCU',
    formula: 'FORMÜL',
    example: 'ÖRNEK'
  };

  return `
    <div class="card ${cardClass}" data-card-id="${card.id}">
      <div class="card-header">
        <span class="card-type ${card.type}">${typeLabels[card.type] || card.type}</span>
        <div class="card-actions">
          <button class="action-btn pin ${isPinned ? 'active' : ''}" data-action="pin" data-id="${card.id}" title="Üstte tut">📌</button>
          <button class="action-btn know ${isKnown ? 'active' : ''}" data-action="know" data-id="${card.id}" title="Biliyorum">✓</button>
        </div>
      </div>
      <div class="card-title">${highlightSearch(card.title)}</div>
      ${card.content ? `<div class="card-content">${highlightSearch(card.content)}</div>` : ''}
      ${detailsHTML}
      ${formulaHTML}
      ${tipHTML}
      <div class="card-id">${card.id}</div>
    </div>
  `;
}

function renderTopic(topic, cards) {
  if (cards.length === 0) return '';
  const tipHTML = topic.tip ? `<div class="topic-tip">${escapeHTML(topic.tip)}</div>` : '';
  return `
    <div class="topic" data-topic-id="${topic.id}">
      <div class="topic-title">${highlightSearch(topic.title)}</div>
      ${tipHTML}
      <div class="cards-grid">
        ${cards.map(c => renderCard(c, topic)).join('')}
      </div>
    </div>
  `;
}

function renderMain() {
  const main = document.getElementById('mainContent');
  const unit = FIZIK_DATA.units.find(u => u.id === state.currentUnit);
  if (!unit) { main.innerHTML = '<div class="empty-state">Ünite bulunamadı.</div>'; return; }

  // Karts ayır: pinned, normal, known
  // Her topic için, search filter uyguladıktan sonra üç gruba böl
  const sections = {
    pinned: [],   // {topic, cards[]}
    normal: [],
    known: []
  };

  unit.topics.forEach(topic => {
    const filteredCards = topic.cards.filter(cardMatchesSearch);
    if (filteredCards.length === 0) return;

    const pinnedCards = filteredCards.filter(c => state.pinned.has(c.id));
    const knownCards = filteredCards.filter(c => state.known.has(c.id) && !state.pinned.has(c.id));
    const normalCards = filteredCards.filter(c => !state.pinned.has(c.id) && !state.known.has(c.id));

    if (pinnedCards.length) sections.pinned.push({ topic, cards: pinnedCards });
    if (normalCards.length) sections.normal.push({ topic, cards: normalCards });
    if (knownCards.length) sections.known.push({ topic, cards: knownCards });
  });

  const totalFiltered = sections.pinned.reduce((a,s)=>a+s.cards.length,0) +
                        sections.normal.reduce((a,s)=>a+s.cards.length,0) +
                        sections.known.reduce((a,s)=>a+s.cards.length,0);

  let html = `
    <div class="unit-header">
      <div class="unit-title">
        <span>${unit.icon}</span>
        <span>${unit.id}. ${unit.title}</span>
      </div>
      <div class="unit-subtitle">
        ${searchQuery ? `"${escapeHTML(searchQuery)}" araması: ${totalFiltered} kart` : `${getAllCardsInUnit(unit).length} kart, ${unit.topics.length} konu`}
      </div>
    </div>
  `;

  if (totalFiltered === 0) {
    html += `<div class="empty-state"><span class="empty-state-icon">🔍</span>${searchQuery ? 'Aramaya uygun kart bulunamadı.' : 'Bu ünitede kart yok.'}</div>`;
    main.innerHTML = html;
    return;
  }

  // PINNED SECTION
  if (sections.pinned.length) {
    const count = sections.pinned.reduce((a,s)=>a+s.cards.length,0);
    html += `
      <section class="section" data-section="pinned">
        <div class="section-header pinned">
          <span class="section-icon">📌</span>
          <span class="section-title">Üstte Tutulanlar</span>
          <span class="section-count">${count}</span>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-content">
          ${sections.pinned.map(({topic, cards}) => renderTopic(topic, cards)).join('')}
        </div>
      </section>
    `;
  }

  // NORMAL SECTION
  if (sections.normal.length) {
    const count = sections.normal.reduce((a,s)=>a+s.cards.length,0);
    html += `
      <section class="section" data-section="normal">
        <div class="section-header">
          <span class="section-icon">📖</span>
          <span class="section-title">Konu Anlatımı</span>
          <span class="section-count">${count}</span>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-content">
          ${sections.normal.map(({topic, cards}) => renderTopic(topic, cards)).join('')}
        </div>
      </section>
    `;
  }

  // KNOWN SECTION
  if (sections.known.length) {
    const count = sections.known.reduce((a,s)=>a+s.cards.length,0);
    html += `
      <section class="section collapsed" data-section="known">
        <div class="section-header known">
          <span class="section-icon">✅</span>
          <span class="section-title">Bildiklerim</span>
          <span class="section-count">${count}</span>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-content">
          ${sections.known.map(({topic, cards}) => renderTopic(topic, cards)).join('')}
        </div>
      </section>
    `;
  }

  main.innerHTML = html;
  attachCardListeners();
  attachSectionListeners();
}

function attachCardListeners() {
  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === 'pin') {
        if (state.pinned.has(id)) {
          state.pinned.delete(id);
        } else {
          state.pinned.add(id);
          state.known.delete(id); // pin'lenince known'dan kaldır
        }
      } else if (action === 'know') {
        if (state.known.has(id)) {
          state.known.delete(id);
        } else {
          state.known.add(id);
          state.pinned.delete(id); // known'a alınınca pin'den kaldır
        }
      }
      saveState();
      renderMain();
      updateStats();
    });
  });
}

function attachSectionListeners() {
  document.querySelectorAll('.section-header').forEach(header => {
    header.addEventListener('click', () => {
      header.parentElement.classList.toggle('collapsed');
    });
  });
}

function updateStats() {
  document.getElementById('statPinned').textContent = state.pinned.size;
  document.getElementById('statKnown').textContent = state.known.size;
  let totalCards = 0;
  FIZIK_DATA.units.forEach(u => totalCards += getAllCardsInUnit(u).length);
  document.getElementById('statTotal').textContent = totalCards;
}

function resetProgress() {
  if (!confirm('Tüm "üstte tut" ve "biliyorum" işaretlemeleri silinecek. Devam edelim mi?')) return;
  state.pinned.clear();
  state.known.clear();
  saveState();
  renderMain();
  updateStats();
}

// ============== SEARCH ==============
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderMain();
  }, 200);
});

// ============== INIT ==============
renderSidebar();
renderMain();
updateStats();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/' || (e.ctrlKey && e.key === 'k')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});
</script>
